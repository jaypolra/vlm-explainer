<svg width="1200" height="560" viewBox="0 0 1200 560" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">VLM Explainer workflow</title>
  <desc id="desc">Workflow showing an image entering BLIP captioning, token-level Grad-CAM, patch masking, caption regeneration, and CLIP verification.</desc>
  <rect width="1200" height="560" rx="24" fill="#F8FAFC"/>
  <rect x="36" y="36" width="1128" height="488" rx="20" fill="#FFFFFF" stroke="#D8E2EC"/>

  <text x="72" y="92" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="34" font-weight="700" fill="#102A43">VLM Explainer: From Patches to Phrases</text>
  <text x="72" y="126" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="18" fill="#52606D">Token-level explanations for pretrained BLIP captions with CLIP alignment verification</text>

  <defs>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#102A43" flood-opacity="0.12"/>
    </filter>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="strokeWidth">
      <path d="M2 2 L10 6 L2 10 Z" fill="#486581"/>
    </marker>
  </defs>

  <g filter="url(#shadow)">
    <rect x="74" y="204" width="170" height="120" rx="14" fill="#E0F2FE" stroke="#7DD3FC"/>
    <text x="159" y="252" text-anchor="middle" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="20" font-weight="700" fill="#0C4A6E">Input Image</text>
    <text x="159" y="281" text-anchor="middle" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="15" fill="#075985">uploaded by user</text>
  </g>

  <line x1="246" y1="264" x2="312" y2="264" stroke="#486581" stroke-width="3" marker-end="url(#arrow)"/>

  <g filter="url(#shadow)">
    <rect x="324" y="176" width="188" height="176" rx="14" fill="#EEF2FF" stroke="#A5B4FC"/>
    <text x="418" y="222" text-anchor="middle" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="20" font-weight="700" fill="#3730A3">BLIP</text>
    <text x="418" y="251" text-anchor="middle" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="15" fill="#4338CA">caption generation</text>
    <text x="418" y="278" text-anchor="middle" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="15" fill="#4338CA">token selection</text>
    <text x="418" y="305" text-anchor="middle" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="15" fill="#4338CA">vision layer choice</text>
  </g>

  <line x1="514" y1="264" x2="580" y2="264" stroke="#486581" stroke-width="3" marker-end="url(#arrow)"/>

  <g filter="url(#shadow)">
    <rect x="592" y="176" width="188" height="176" rx="14" fill="#FDF2F8" stroke="#F9A8D4"/>
    <text x="686" y="222" text-anchor="middle" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="20" font-weight="700" fill="#9D174D">Token Grad-CAM</text>
    <text x="686" y="251" text-anchor="middle" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="15" fill="#BE185D">which patches support</text>
    <text x="686" y="278" text-anchor="middle" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="15" fill="#BE185D">a generated word?</text>
    <text x="686" y="305" text-anchor="middle" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="15" fill="#BE185D">heatmap overlay</text>
  </g>

  <line x1="782" y1="264" x2="848" y2="264" stroke="#486581" stroke-width="3" marker-end="url(#arrow)"/>

  <g filter="url(#shadow)">
    <rect x="860" y="176" width="188" height="176" rx="14" fill="#FFF7ED" stroke="#FDBA74"/>
    <text x="954" y="222" text-anchor="middle" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="20" font-weight="700" fill="#9A3412">Mask + Retest</text>
    <text x="954" y="251" text-anchor="middle" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="15" fill="#C2410C">2-click rectangle</text>
    <text x="954" y="278" text-anchor="middle" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="15" fill="#C2410C">24 x 24 patch grid</text>
    <text x="954" y="305" text-anchor="middle" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="15" fill="#C2410C">new caption</text>
  </g>

  <line x1="954" y1="354" x2="954" y2="398" stroke="#486581" stroke-width="3" marker-end="url(#arrow)"/>

  <g filter="url(#shadow)">
    <rect x="724" y="406" width="456" height="72" rx="14" fill="#F0FDF4" stroke="#86EFAC"/>
    <text x="952" y="436" text-anchor="middle" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="19" font-weight="700" fill="#166534">Perturbation validation</text>
    <text x="952" y="463" text-anchor="middle" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="15" fill="#15803D">if an important region is masked, the generated language should change</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="74" y="396" width="548" height="82" rx="14" fill="#F8FAFC" stroke="#CBD5E1"/>
    <text x="348" y="429" text-anchor="middle" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="19" font-weight="700" fill="#334155">CLIP verification</text>
    <text x="348" y="457" text-anchor="middle" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="15" fill="#475569">image-text similarity plus CLIP Grad-CAM sanity check for alignment</text>
  </g>

  <line x1="418" y1="354" x2="348" y2="388" stroke="#486581" stroke-width="3" marker-end="url(#arrow)"/>
  <line x1="686" y1="354" x2="614" y2="407" stroke="#486581" stroke-width="3" marker-end="url(#arrow)"/>
</svg>
